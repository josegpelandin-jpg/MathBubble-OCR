plugins { id 'com.android.application' }

android {
    namespace 'com.mahetre.mathbubble'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.mahetre.mathbubble"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "0.4-math-auto"
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
