workflows:
  android-debug:
    name: MathBubble OCR V3 Debug APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Verify project
        script: |
          pwd
          ls -la
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/mahetre/mathbubble/CaptureService.java
      - name: Build APK
        script: |
          gradle :app:assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
