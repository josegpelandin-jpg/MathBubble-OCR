workflows:
  android-debug:
    name: MathBubble OCR Android Debug
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Verify project
        script: |
          pwd
          ls -la
          test -f settings.gradle
          test -f app/build.gradle
      - name: Build APK
        script: |
          gradle :app:assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
