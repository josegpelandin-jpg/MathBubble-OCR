workflows:
  android-debug:
    name: MathBubble OCR Debug APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Create Gradle wrapper
        script: |
          gradle wrapper --gradle-version 8.9
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
